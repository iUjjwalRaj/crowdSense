[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdsense-backend"
version = "0.1.0"
description = "CrowdSense backend for occupancy inference and journey planning"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pandas>=2.0",
  "pyarrow>=15",
  "SQLAlchemy>=2,<3",
  "alembic>=1.13",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
